spring.application.name=carddemo-online
server.port=8080
server.servlet.context-path=/carddemo

# VSAM file paths (override in environment or test properties)
carddemo.usrsec.path=./data/USRSEC.bin
carddemo.xref.path=./data/CARDXREF.bin
carddemo.acct.path=./data/ACCTDAT.bin
carddemo.cust.path=./data/CUSTDAT.bin
carddemo.tran.path=./data/TRANSACT.bin
carddemo.card.path=./data/CARDDAT.bin

# Session configuration
server.servlet.session.timeout=30m
spring.session.store-type=none

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Database (H2 for development, override with PostgreSQL in production)
spring.datasource.url=jdbc:h2:mem:carddemo;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Schema initialization
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
